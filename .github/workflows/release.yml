name: Publish Docker release

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: read

concurrency:
  group: docker-release
  cancel-in-progress: false

env:
  IMAGE_NAME: dwightmulcahy/noip-bot
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  preflight:
    name: Verify release image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      is_latest: ${{ steps.release_version.outputs.is_latest }}

    steps:
      - name: Check out released revision
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Determine rolling-tag eligibility
        id: release_version
        shell: bash
        run: |
          set -euo pipefail
          current_version="${RELEASE_TAG#v}"
          latest_version="$({
            git tag --list |
              sed -nE 's/^v?([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' |
              sort -V |
              tail -n 1
          })"
          if [[ -z "${latest_version}" ]]; then
            echo "No stable semantic-version tags were found." >&2
            exit 1
          fi
          if [[ "${current_version}" == "${latest_version}" ]]; then
            echo "is_latest=true" >> "${GITHUB_OUTPUT}"
          else
            echo "is_latest=false" >> "${GITHUB_OUTPUT}"
          fi
          echo "Current release: ${current_version}"
          echo "Latest stable release: ${latest_version}"

      - name: Validate release tag and branch
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_TAG}" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Unsupported release tag: ${RELEASE_TAG}" >&2
            exit 1
          fi
          git fetch --no-tags origin \
            +refs/heads/release:refs/remotes/origin/release
          if ! git merge-base --is-ancestor \
            "${GITHUB_SHA}" refs/remotes/origin/release; then
            echo "Tagged commit ${GITHUB_SHA} is not contained in the release branch." >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3

      - name: Build local release candidate
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6
        with:
          context: .
          load: true
          build-args: |
            APP_VERSION=${{ env.RELEASE_TAG }}
          tags: noip-bot:release-candidate
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test release candidate
        run: scripts/container_smoke_test.sh noip-bot:release-candidate

      - name: Verify installed package security floors
        run: >-
          docker run --rm --entrypoint python noip-bot:release-candidate
          /app/scripts/verify_package_security.py

      - name: Scan release candidate
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: noip-bot:release-candidate
          format: table
          exit-code: "1"
          ignore-unfixed: true
          scanners: vuln
          skip-files: "**/site-packages/pip/_vendor/bom.cdx.json"
          vuln-type: os,library
          severity: CRITICAL,HIGH

  publish:
    name: Publish multi-architecture image
    runs-on: ubuntu-latest
    needs: preflight
    timeout-minutes: 60

    steps:
      - name: Check out released revision
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@53851d14592bedcffcf25ea515637cff71ef929a # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3

      - name: Log in to Docker Hub
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@369eb591f429131d6889c46b94e711f089e6ca96 # v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ needs.preflight.outputs.is_latest == 'true' }}
            type=raw,value=latest,enable=${{ needs.preflight.outputs.is_latest == 'true' }}
          labels: |
            org.opencontainers.image.title=No-IP Renewal Bot
            org.opencontainers.image.description=Automated No-IP free-host renewal service

      - name: Build and push image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: |
            APP_VERSION=${{ env.RELEASE_TAG }}
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  github-release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: [preflight, publish]
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out released revision
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Generate conventional release notes
        run: >-
          python scripts/generate_release_notes.py
          --tag "${RELEASE_TAG}"
          --output release-notes.md

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          IS_LATEST: ${{ needs.preflight.outputs.is_latest }}
        shell: bash
        run: |
          set -euo pipefail
          latest_flag="--latest=false"
          if [[ "${IS_LATEST}" == "true" ]]; then
            latest_flag="--latest"
          fi
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" \
              --title "No-IP Bot ${RELEASE_TAG#v}" \
              --notes-file release-notes.md \
              "${latest_flag}"
          else
            gh release create "${RELEASE_TAG}" \
              --verify-tag \
              --title "No-IP Bot ${RELEASE_TAG#v}" \
              --notes-file release-notes.md \
              "${latest_flag}"
          fi
          cat release-notes.md >> "${GITHUB_STEP_SUMMARY}"
