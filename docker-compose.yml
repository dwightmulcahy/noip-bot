services:
  noip-bot:
    image: dwightmulcahy/noip-bot:latest
    container_name: noip-bot
    restart: unless-stopped
    env_file:
      # Absolute path — some Docker frontends (e.g. QNAP Container Station)
      # resolve a relative "./.env" against a staging directory rather than
      # wherever this compose file lives, causing a "file not found" error.
      - /share/Data/config/noip-bot/.env
    environment:
      BIND_ADDR: 0.0.0.0
      PORT: 9080
    ports:
      - "9080:9080"
    volumes:
      # Persist your .env (secrets) outside the container so it survives
      # rebuilds and can be edited without touching the image.
      - /share/Data/config/noip-bot/.env:/app/.env
      # Debug/error screenshots (see SCREENSHOT_DIR in the Dockerfile).
      - /share/Data/noip-bot/screenshots:/data/screenshots
