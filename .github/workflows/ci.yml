name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.12 tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint Python sources
        run: ruff check .

      - name: Check Python formatting
        run: ruff format --check .

      - name: Type-check core modules
        run: mypy

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Verify application imports
        run: python -c "import noip_bot; print('application import succeeded')"

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3

      - name: Build container
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6
        with:
          context: .
          build-args: |
            APP_VERSION=0.0.0-dev+${{ github.sha }}
          push: false
          load: true
          tags: noip-bot:verify
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test running container
        run: scripts/container_smoke_test.sh noip-bot:verify

      - name: Verify installed package security floors
        run: >-
          docker run --rm --entrypoint python noip-bot:verify
          /app/scripts/verify_package_security.py

      - name: Scan image for fixable high and critical vulnerabilities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: noip-bot:verify
          format: table
          exit-code: "1"
          ignore-unfixed: true
          scanners: vuln
          skip-files: "**/site-packages/pip/_vendor/bom.cdx.json"
          vuln-type: os,library
          severity: CRITICAL,HIGH
