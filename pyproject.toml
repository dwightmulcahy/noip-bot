[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
files = [
    "app_config.py",
    "application.py",
    "health_status.py",
    "host_timing.py",
    "logging_config.py",
    "noip_bot.py",
    "noip_renew/noip_renew.py",
    "noip_renew/page_contract.py",
    "notifications.py",
    "run_lock.py",
    "scheduling.py",
    "state_store.py",
    "status_server.py",
    "version.py",
]
ignore_missing_imports = true
follow_imports = "skip"
disable_error_code = ["import-untyped"]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
