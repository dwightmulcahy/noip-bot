name: Publish Docker release

on:
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: docker-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  IMAGE_NAME: dwightmulcahy/noip-bot

jobs:
  preflight:
    name: Verify release image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out released revision
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3

      - name: Build local release candidate
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6
        with:
          context: .
          load: true
          build-args: |
            APP_VERSION=${{ github.event.release.tag_name }}
          tags: noip-bot:release-candidate
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test release candidate
        run: scripts/container_smoke_test.sh noip-bot:release-candidate

      - name: Scan release candidate
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: noip-bot:release-candidate
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

  publish:
    name: Publish multi-architecture image
    runs-on: ubuntu-latest
    needs: preflight
    timeout-minutes: 60

    steps:
      - name: Check out released revision
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@53851d14592bedcffcf25ea515637cff71ef929a # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3

      - name: Log in to Docker Hub
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@369eb591f429131d6889c46b94e711f089e6ca96 # v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=No-IP Renewal Bot
            org.opencontainers.image.description=Automated No-IP free-host renewal service

      - name: Build and push image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: |
            APP_VERSION=${{ github.event.release.tag_name }}
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
