name: Verify

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} tests
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    uses: dwightmulcahy/repo-template/.github/workflows/reusable-python-ci.yml@d89e9db45ba77fd32d95da02620476eada9c01cd
    with:
      python-version: ${{ matrix.python-version }}
      install-command: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements-dev.txt
      lint-command: |
        ruff check .
        ruff format --check .
        mypy
        python -m compileall -q .
      test-command: |
        python -m unittest discover -s tests -v
        python -c "import noip_bot; print('application import succeeded')"

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v3

      - name: Build container
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v6
        with:
          context: .
          build-args: |
            APP_VERSION=0.0.0-dev+${{ github.sha }}
          push: false
          load: true
          tags: noip-bot:verify
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test running container
        run: scripts/container_smoke_test.sh noip-bot:verify

      - name: Verify installed package security floors
        run: >-
          docker run --rm --entrypoint python noip-bot:verify
          /app/scripts/verify_package_security.py

      - name: Scan image for fixable high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: noip-bot:verify
          format: table
          exit-code: "1"
          ignore-unfixed: true
          scanners: vuln
          skip-files: "**/site-packages/pip/_vendor/bom.cdx.json"
          vuln-type: os,library
          severity: CRITICAL,HIGH
