name: Publish Docker release

on:
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: docker-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  IMAGE_NAME: dwightmulcahy/noip-bot

jobs:
  publish:
    name: Publish multi-architecture image
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out released revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=No-IP Renewal Bot
            org.opencontainers.image.description=Automated No-IP free-host renewal service

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

