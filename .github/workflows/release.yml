name: Publish Docker release

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: read

concurrency:
  group: docker-release
  cancel-in-progress: false

env:
  IMAGE_NAME: dwightmulcahy/noip-bot
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  preflight:
    name: Verify release image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      is_latest: ${{ steps.release_version.outputs.is_latest }}

    steps:
      - name: Check out released revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Determine rolling-tag eligibility
        id: release_version
        shell: bash
        run: |
          set -euo pipefail
          current_version="${RELEASE_TAG#v}"
          latest_version="$({
            git tag --list |
              sed -nE 's/^v?([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' |
              sort -V |
              tail -n 1
          })"
          if [[ -z "${latest_version}" ]]; then
            echo "No stable semantic-version tags were found." >&2
            exit 1
          fi
          if [[ "${current_version}" == "${latest_version}" ]]; then
            echo "is_latest=true" >> "${GITHUB_OUTPUT}"
          else
            echo "is_latest=false" >> "${GITHUB_OUTPUT}"
          fi
          echo "Current release: ${current_version}"
          echo "Latest stable release: ${latest_version}"

      - name: Validate release tag and branch
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_TAG}" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Unsupported release tag: ${RELEASE_TAG}" >&2
            exit 1
          fi
          git fetch --no-tags origin \
            +refs/heads/release:refs/remotes/origin/release
          if ! git merge-base --is-ancestor \
            "${GITHUB_SHA}" refs/remotes/origin/release; then
            echo "Tagged commit ${GITHUB_SHA} is not contained in the release branch." >&2
            exit 1
          fi

  validate:
    name: Full validation suite
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish multi-architecture image
    runs-on: ubuntu-latest
    needs: [preflight, validate]
    timeout-minutes: 60

    steps:
      - name: Check out released revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v3

      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ needs.preflight.outputs.is_latest == 'true' }}
            type=semver,pattern={{major}},enable=${{ needs.preflight.outputs.is_latest == 'true' }}
            type=raw,value=latest,enable=${{ needs.preflight.outputs.is_latest == 'true' }}
          labels: |
            org.opencontainers.image.title=No-IP Renewal Bot
            org.opencontainers.image.description=Automated No-IP free-host renewal service

      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: |
            APP_VERSION=${{ env.RELEASE_TAG }}
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  github-release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: [preflight, publish]
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out released revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Generate conventional release notes
        uses: dwightmulcahy/repo-template/.github/actions/release-notes@f3dc1af2146156866574485a20ded5ac35d08a88
        with:
          tag: ${{ github.ref_name }}
          project-name: "No-IP Bot"
          image: "dwightmulcahy/noip-bot"
          output: "release-notes.md"
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          IS_LATEST: ${{ needs.preflight.outputs.is_latest }}
        shell: bash
        run: |
          set -euo pipefail
          latest_flag="--latest=false"
          if [[ "${IS_LATEST}" == "true" ]]; then
            latest_flag="--latest"
          fi
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" \
              --title "No-IP Bot ${RELEASE_TAG#v}" \
              --notes-file release-notes.md \
              "${latest_flag}"
          else
            gh release create "${RELEASE_TAG}" \
              --verify-tag \
              --title "No-IP Bot ${RELEASE_TAG#v}" \
              --notes-file release-notes.md \
              "${latest_flag}"
          fi
          cat release-notes.md >> "${GITHUB_STEP_SUMMARY}"
