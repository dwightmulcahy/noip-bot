            grecaptcha.ready( function() {
                grecaptcha.execute(
                    "6LceAcEZAAAAAK9LjsJrTYcI-7RSvlTaO2B8axUG",
                    { action: 'login' },
                ).then( function(token) {
                    document.getElementById('clogs-captcha-token').value = token;
                    document.getElementById('clogs').submit();
                })
            });
        } else {
            document.getElementById('clogs').submit();
        }
    }
</script>
